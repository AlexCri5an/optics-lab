[workspace]
resolver = "3"
members = [
    # Library crates
    "crates/optics-core",
    "crates/optics-spectral",
    "crates/optics-glass",
    "crates/optics-bvh",
    "crates/optics-zemax",
    "crates/optics-render",
    "crates/optics-optimize",
    "crates/optics-tolerance",
    "crates/optics-nonseq",
    "crates/optics-engine",
    "crates/optics-ffi",
    "crates/optics-ui",
    # Application targets
    "apps/optics-cli",
    "apps/optics-desktop",
]

[workspace.package]
version     = "0.0.1"
edition     = "2024"
authors     = ["OpticsLab Contributors"]
license     = "MIT OR Apache-2.0"
repository  = "https://github.com/AlexCri5an/optics-lab"
rust-version = "1.87"

# ---------------------------------------------------------------------------
# Workspace-wide lint policy (Zero-panic standard)
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro    = "warn"
unwrap_used  = "deny"
expect_used  = "deny"
todo         = "warn"
panic        = "warn"

# ---------------------------------------------------------------------------
# Workspace-wide dependency versions — single source of truth.
# IMPORTANT: eframe 0.32.3 pulls in wgpu 25.0.2; optics-render MUST use the
# same wgpu semver range so Cargo deduplicates them into one copy.
# ---------------------------------------------------------------------------
[workspace.dependencies]
# Math
nalgebra   = { version = "0.33", features = ["serde-serialize"] }

# Serialisation
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror  = "2"

# CLI
clap       = { version = "4", features = ["derive"] }

# GUI / Desktop (VectorCraft & academic standard)
egui        = "0.32"
eframe      = "0.32.3"
egui_extras = { version = "0.32.3", features = ["svg"] }
rfd         = "0.15"

# GPU / rendering
wgpu       = { version = "25", features = ["fragile-send-sync-non-atomic-wasm"] }      # Locked to match eframe 0.32.3 (egui-wgpu 0.32.3 → wgpu 25.0.2)
bytemuck   = { version = "1", features = ["derive"] }
half       = "2"

# Internal crates
optics-core     = { path = "crates/optics-core" }
optics-spectral = { path = "crates/optics-spectral" }
optics-glass    = { path = "crates/optics-glass" }
optics-bvh      = { path = "crates/optics-bvh" }
optics-zemax    = { path = "crates/optics-zemax" }
optics-render   = { path = "crates/optics-render" }
optics-optimize = { path = "crates/optics-optimize" }
optics-tolerance = { path = "crates/optics-tolerance" }
optics-nonseq    = { path = "crates/optics-nonseq" }
optics-engine    = { path = "crates/optics-engine" }
optics-ffi       = { path = "crates/optics-ffi" }
optics-ui       = { path = "crates/optics-ui" }


