name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: optics-lab-macos-arm64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: optics-lab-macos-x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: optics-lab-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: optics-lab-windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers libxkbcommon-dev libwayland-dev

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }} -p optics-desktop -p optics-cli

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist staging/OpticsLab.app/Contents/MacOS staging/OpticsLab.app/Contents/Resources
          cp target/${{ matrix.target }}/release/OpticsLab staging/OpticsLab.app/Contents/MacOS/OpticsLab
          cp packaging/macos/OpticsLab.icns staging/OpticsLab.app/Contents/Resources/OpticsLab.icns
          chmod +x staging/OpticsLab.app/Contents/MacOS/OpticsLab
          VERSION=${GITHUB_REF_NAME#v}
          sed -e "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist.in > staging/OpticsLab.app/Contents/Info.plist
          printf 'APPL????' > staging/OpticsLab.app/Contents/PkgInfo
          codesign --force --deep --sign - staging/OpticsLab.app
          mkdir -p dmg-stage
          cp -R staging/OpticsLab.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -srcfolder dmg-stage -volname "OpticsLab" -fs HFS+ -format UDZO -ov "dist/${{ matrix.artifact_name }}.dmg"
          cd target/${{ matrix.target }}/release && zip -r "../../../dist/${{ matrix.artifact_name }}-cli.zip" optics-cli

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist staging
          cp target/${{ matrix.target }}/release/OpticsLab staging/
          cp target/${{ matrix.target }}/release/optics-cli staging/
          cd staging && tar -czvf "../dist/${{ matrix.artifact_name }}.tar.gz" *

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist staging
          cp target/${{ matrix.target }}/release/OpticsLab.exe staging/
          cp target/${{ matrix.target }}/release/optics-cli.exe staging/
          cd staging && 7z a -tzip "../dist/${{ matrix.artifact_name }}.zip" *

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
