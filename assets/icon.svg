<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background styling: technical dark slate or transparent frame -->
    <rect id="bg" width="256" height="256" rx="4" fill="#1e222b"/>
  </defs>

  <!-- Base background plate -->
  <use href="#bg"/>

  <!-- Prism geometry (flat equilateral triangle with subtle tint and crisp 2px border) -->
  <polygon points="120,44 60,192 180,192" fill="#2c3342" stroke="#687791" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Incident beam: crisp white ray entering left face -->
  <line x1="20" y1="130" x2="85" y2="130" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Internal refracted dispersion paths (white to colored fan) -->
  <line x1="85" y1="130" x2="148" y2="114" stroke="#e0f2fe" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="85" y1="130" x2="152" y2="124" stroke="#e0f2fe" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="85" y1="130" x2="156" y2="134" stroke="#e0f2fe" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="85" y1="130" x2="160" y2="144" stroke="#e0f2fe" stroke-width="1.5" stroke-opacity="0.8"/>

  <!-- Emerging dispersed spectral fan -->
  <!-- Red (656 nm) - least deflected -->
  <line x1="148" y1="114" x2="236" y2="100" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Orange / Yellow (589 nm) -->
  <line x1="152" y1="124" x2="236" y2="122" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Green (520 nm) -->
  <line x1="156" y1="134" x2="236" y2="144" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cyan / Blue (486 nm) -->
  <line x1="158" y1="139" x2="236" y2="166" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Violet (400 nm) - most deflected -->
  <line x1="160" y1="144" x2="236" y2="188" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Subtle entrance refraction point marker -->
  <circle cx="85" cy="130" r="2.5" fill="#ffffff"/>
</svg>
