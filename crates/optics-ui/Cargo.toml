[package]
name        = "optics-ui"
description = "egui design tokens, dockable panels, interactive canvas"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
optics-core     = { workspace = true }
optics-spectral = { workspace = true }
optics-glass    = { workspace = true }
optics-zemax    = { workspace = true }
egui            = { workspace = true }
eframe          = { workspace = true, features = ["accesskit"] }
egui-phosphor   = { workspace = true }
serde           = { workspace = true }
serde_json      = { workspace = true }

[dev-dependencies]
egui_kittest = { version = "0.32.3", features = ["snapshot", "wgpu"] }

[lints]
workspace = true

