[package]
name        = "optics-web"
description = "OpticsLab — WebAssembly (WASM + WebGPU) browser deployment"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
rust-version.workspace = true

# eframe handles wasm32-unknown-unknown natively — no wasm-bindgen entry needed
# in addition; eframe exposes a JS-callable start function automatically.
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
optics-ui = { workspace = true }
eframe    = { workspace = true }
serde     = { workspace = true }

[lints]
workspace = true
